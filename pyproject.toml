[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "math-validator-3.0"
version = "3.0.0"
description = "Topologiczny walidator równań matematycznych"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Jacek Kielich", email = "jbackk-lang@proton.me"}
]
requires-python = ">=3.8"
dependencies = [
    "numpy>=1.21.0",
    "sympy>=1.9.0",
    "pint>=0.19.0",
    "fastapi>=0.85.0",
    "uvicorn>=0.18.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "black>=22.0.0",
    "isort>=5.10.0",
    "flake8>=5.0.0",
    "mypy>=0.990",
    "pdoc>=12.0.0",
    "httpx2"
    # httpx2: niedeklarowana wcześniej zależność przechodnia -
    # starlette.testclient.TestClient (uzywany w test/test_api_*.py) wymaga
    # httpx2 (nastepca httpx w tej wersji starlette), inaczej import test/
    # padał na etapie collect z RuntimeError, zanim jakikolwiek test sie
    # uruchomil (CI: test (3.12) - "Failed in 7 seconds").
]
api = [
    "fastapi>=0.85.0",
    "uvicorn>=0.18.0"
]

[project.scripts]
math-validator = "cli:main"

[tool.setuptools]
# POPRAWKA #2 (2026-09-08, CI: test (3.12) failing - "package directory 'core'
# does not exist"): poprzednia jawna lista `packages = ["core","filters",
# "plugins","examples","test","tests"]` zakładała pakiety, których w repo NIE
# MA jako katalogów - "core", "plugins" i "tests" to literalnie nieistniejące
# ścieżki (jest core.py i plugins.py jako pojedyncze pliki, jest "test" liczba
# pojedyncza, nie "tests"). Cała baza kodu poza `filters/` (jedyny katalog z
# `__init__.py`) to płaskie moduły importowane bezpośrednio z korzenia repo
# (`from core import ParsedExpr`, `from linalg import ...`, `from ambiguity
# import ...` - potwierdzone grepem po realnych importach w test/*.py,
# api.py, cli.py). setuptools rozróżnia to jako `packages` (katalogi z
# __init__.py) vs `py_modules` (pojedyncze pliki .py w korzeniu) - to dwie
# różne opcje, nie jedna lista. Poprawiono też entry point:
# `math_validator.cli:main` wskazywał na nieistniejący pakiet
# `math_validator` (nigdy nie istniał w tym repo); `cli.py` w swoim własnym
# docstringu deklaruje nazwę komendy `math-validator`, nie `math-validate`
# - ujednolicono do tego, co faktycznie mówi kod.
packages = ["filters"]
py-modules = [
    "core",
    "ambiguity",
    "linalg",
    "normalize",
    "errors",
    "units",
    "variables",
    "sympy_bridge",
    "plugins",
    "paradox_trigger_module",
    "math_validator_triggers",
    "pipeline_v3",
    "api",
    "cli",
    "algebra",
    "logic",
    "parser",
    "plot"
]
